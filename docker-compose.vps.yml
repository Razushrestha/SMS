# Namecheap VPS: Postgres + API + web on localhost; nginx terminates TLS.
# Usage: docker compose -f docker-compose.vps.yml --env-file .env up --build -d
# Then: docker compose -f docker-compose.vps.yml exec api npm run db:migrate
#       (or npm run db:migrate on the host against 127.0.0.1:5432)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nepatronix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nepatronix}
    volumes:
      - nepatronix_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nepatronix} -d ${POSTGRES_DB:-nepatronix}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-nepatronix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nepatronix}
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-nepatronix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nepatronix}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL}
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nepatronix_pg:
